name: Actual-image pose evaluation
on:
  push:
    paths:
      - 'dist/inference.js'
      - 'dist/hand-refinement.js'
      - 'dist/models.js'
      - 'dist/model-cache.js'
      - 'dist/runtime.js'
      - 'scripts/evaluate.py'
      - 'scripts/evaluate-detector.py'
      - '.github/workflows/evaluate.yml'
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model IDs
        default: rtmw-l-384
      dataset:
        description: 'official-example or val-subset (larger evaluation)'
        default: val-subset
      people:
        description: Maximum annotated people
        default: '64'
permissions:
  contents: read
concurrency:
  group: actual-image-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inference-only dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 onnxruntime==1.23.2 opencv-python-headless==4.12.0.88
      - name: Check application JavaScript syntax
        run: |
          for file in dist/*.js server.mjs; do
            if test -f "$file"; then
              node --check "$file"
            fi
          done
      - name: Evaluate real annotated photographs
        env:
          MODEL_IDS: ${{ inputs.models || 'rtmw-l-384' }}
          DATASET: ${{ inputs.dataset || 'val-subset' }}
          PEOPLE: ${{ inputs.people || '64' }}
        run: python scripts/evaluate.py --models "$MODEL_IDS" --dataset "$DATASET" --people "$PEOPLE" --out artifacts
      - name: Verify person detection on one real annotated image
        run: python scripts/evaluate-detector.py --out artifacts/detector.json
      - name: Verify geometry contract
        run: node scripts/verify-geometry.mjs
      - name: Publish measured results to run summary
        if: always()
        run: |
          if test -f artifacts/summary.md; then
            cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save reports and evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-image-evaluation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
