name: Publish the verified causal tracker artifact
on:
  push:
    branches: [main, phase3-20261102-4fc7ff60]
    paths: ['evaluation/tapir-publish.py', '.github/workflows/tapir-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wholebody-tapir-publication
  cancel-in-progress: false
jobs:
  publish-verified-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the numerically verified normalized export
        uses: actions/download-artifact@v4
        with:
          name: tapir-model-package-274407d44a7fbdcb8411f9dc78286b1f49409c6d
          path: tapir-model-package
          run-id: 41384892970
          github-token: ${{ github.token }}
      - name: Install publication client
        run: python -m pip install huggingface_hub==0.31.2
      - name: Publish into the requested repository or the authorized dedicated folder
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
        run: python evaluation/tapir-publish.py --models tapir-model-package --output tapir-publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: tapir-publication-${{ github.sha }}
          path: tapir-publication.json
          retention-days: 14
