name: Application syntax
on:
  push:
    paths:
      - 'dist/**'
      - 'server.mjs'
      - '.github/workflows/app.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for file in dist/*.js server.mjs; do
            node --check "$file"
          done
