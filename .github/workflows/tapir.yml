name: Causal BootsTAPIR conversion and numerical comparison
on:
  push:
    branches: [main, phase3-20261102-4fc7ff60]
    paths: ['evaluation/tapir-export.py', 'dist/tapir-codec.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wholebody-tapir-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evaluation/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU conversion runtime
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r evaluation/requirements.txt onnx==1.18.0 dm-tree==0.1.9 einshape==1.0
      - name: Export official causal weights and compare recurrent outputs
        run: python evaluation/tapir-export.py --output tapir-model-package --results evaluation/tapir-results --threads 2
      - name: Compare the shipped browser codec with independent PyTorch preprocessing
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { tapirFrameTensor, tapirQueryTensor, decodeTapir, createTapirCausalState } from './dist/tapir-codec.mjs';
          const root = 'evaluation/tapir-results/codec-fixture/';
          const fixture = JSON.parse(await readFile(root + 'fixture.json', 'utf8'));
          const manifestPath = 'tapir-model-package/tapir-models.json';
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          const image = { width: fixture.width, height: fixture.height, data: new Uint8Array(await readFile(root + fixture.imageFile)) };
          const referenceBytes = await readFile(root + fixture.frameFile);
          const reference = new DataView(referenceBytes.buffer, referenceBytes.byteOffset, referenceBytes.byteLength);
          const actual = tapirFrameTensor(image);
          if (actual.byteLength !== reference.byteLength) throw new Error('Frame shape mismatch');
          let frameMaxAbs = 0;
          for (let i = 0; i < actual.length; i++) frameMaxAbs = Math.max(frameMaxAbs, Math.abs(actual[i] - reference.getFloat32(i * 4, true)));
          const query = tapirQueryTensor(fixture.pointsXY, image), expectedQuery = fixture.queryYX.flat();
          const queryMaxAbs = Math.max(...query.map((value, i) => Math.abs(value - expectedQuery[i])));
          const decoded = decodeTapir(fixture.outputs, image);
          const coordinateMaxAbs = Math.max(...decoded.flatMap((point, i) => ['x', 'y'].map(key => Math.abs(point[key] - fixture.decodedReference[i][key]))));
          const confidenceMaxAbs = Math.max(...decoded.map((point, i) => Math.abs(point.score - fixture.decodedReference[i].score)));
          const visibilityMismatches = decoded.filter((point, i) => point.observable !== fixture.decodedReference[i].observable).length;
          const state = createTapirCausalState(manifest);
          const zeroStateValid = state.length === manifest.stateShape[0] && state.every(value => value === 0);
          const passed = frameMaxAbs <= 2e-6 && queryMaxAbs <= 2e-5 && coordinateMaxAbs <= 1e-4 && confidenceMaxAbs <= 2e-6 && visibilityMismatches === 0 && zeroStateValid;
          const result = { schemaVersion: 1, passed, frameMaxAbs, queryMaxAbs, coordinateMaxAbs, confidenceMaxAbs, visibilityMismatches, zeroStateValid,
            reference: 'PyTorch bilinear align_corners=false, official ONNX output and torch.sigmoid', publicFixtureOnly: true, browserHardwareExecuted: false };
          await writeFile('evaluation/tapir-results/tapir-codec-parity.json', JSON.stringify(result, null, 2) + '\n');
          if (!passed) throw new Error('Shipped TAPIR codec differs from the independent reference: ' + JSON.stringify(result));
          manifest.codecParityPassed = true;
          await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapir-measured-results-${{ github.sha }}
          path: evaluation/tapir-results/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tapir-model-package-${{ github.sha }}
          path: tapir-model-package/
          retention-days: 7
  publish:
    needs: export-and-compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: tapir-model-package-${{ github.sha }}
          path: tapir-model-package
      - name: Install publication client
        run: python -m pip install huggingface_hub==0.31.2
      - name: Publish only verified ONNX graphs into the separate Apache-2.0 repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
        run: python evaluation/tapir-publish.py --models tapir-model-package --output tapir-publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: tapir-publication-${{ github.sha }}
          path: tapir-publication.json
          retention-days: 7
