name: Compact VRC publish and headless inference
on:
  push:
    branches: [compact-vrc-20261102-7fe4fac1]
    paths: ['training/model.py', 'training/data.py', 'training/train.py', 'parts/**', 'dist/**', 'build/**', 'server/**', 'ci/**', '.github/workflows/compact.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-vrc-7fe4fac1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compact59:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/compact59
          key: compact59-public-v1-${{ runner.os }}
      - uses: actions/cache@v4
        id: trained
        with:
          path: artifacts/compact59
          key: compact59-trained-v1-9ed63fc278b4e0daefbaaef92ba44c2dcd89b9f5b69a47ae96a7c4c8bf722b93
      - name: Install CPU PyTorch and model runtime
        if: steps.trained.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ci/requirements.txt
      - name: Train reduced head and evaluate independent real images
        if: steps.trained.outputs.cache-hit != 'true'
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: python training/train.py --output artifacts/compact59 --cache .cache/compact59 --train-count 512 --eval-count 128 --steps 1800 --batch-size 16 --threads 4 --reference-onnx-url https://huggingface.co/RabbitDaisuke/RTMPose-Wholebody-onnx/resolve/9d7f318c43452baf33f1b39d39c1f8c03512aeb5/rtmpose-t-256x192-fp32.onnx --reference-onnx-sha256 fcaae4a08ea7610b4bcc5d0b9e8a7e80fd6f2d998be41438a1b2737056a7623f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact59-${{ github.sha }}
          path: |
            artifacts/compact59/*.onnx
            artifacts/compact59/*.pth
            artifacts/compact59/*.json
            artifacts/compact59/*.md
          if-no-files-found: error
          retention-days: 7
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/parts
          key: footnet-public-v1-${{ runner.os }}
      - uses: actions/cache@v4
        id: trained
        with:
          path: artifacts/parts
          key: parts-trained-v1-${{ hashFiles('parts/**') }}
      - name: Install CPU PyTorch and model runtime
        if: steps.trained.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ci/requirements.txt
      - name: Train foot view classifier and measure face model
        if: steps.trained.outputs.cache-hit != 'true'
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: python parts/prepare.py --mode all --output artifacts/parts --report artifacts/parts --cache .cache/parts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-${{ github.sha }}
          path: |
            artifacts/parts/*.onnx
            artifacts/parts/*.json
            artifacts/parts/*.md
          if-no-files-found: error
          retention-days: 7
  application:
    needs: [compact59, parts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: compact59-${{ github.sha }}
          path: artifacts/compact59
      - uses: actions/download-artifact@v4
        with:
          name: parts-${{ github.sha }}
          path: artifacts/parts
      - name: Check configured private-input availability
        env:
          PRIVATE_VIDEO_URL: ${{ secrets.PRIVATE_VIDEO_URL }}
        run: node -e 'console.log(JSON.stringify({privateVideoFetchConfigured:Boolean(process.env.PRIVATE_VIDEO_URL)}))'
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/fast59
          key: fast59-trained-v1-b41fb2dae145d7c697b4bcb9cd9967bd5b966fd2bc3bd9281de0979079cf016c
          fail-on-cache-miss: true
      - name: Build pinned runtime without lifecycle scripts
        run: |
          npm ci --ignore-scripts --prefix build
          npm ci --ignore-scripts --prefix server
          node build/node_modules/esbuild/bin/esbuild build/vrm-entry.mjs --bundle --format=esm --minify --outfile=dist/vendor/vrm-runtime.mjs
      - name: Publish model-only allowlist to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python -m pip install huggingface_hub==0.36.0
          python ci/publish_hf.py
      - name: Prepare deployable models and measured results
        run: node ci/package.mjs
      - name: Run real ONNX inference and VRM updates in headless Node
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --ignore-scripts --no-audit --no-fund --prefix .cache/headless onnxruntime-node@1.22.0
          node ci/headless-video.mjs --output dist/evidence/headless-video.json
      - name: Private video inference when an existing private fetch secret is configured
        env:
          PRIVATE_VIDEO_URL: ${{ secrets.PRIVATE_VIDEO_URL }}
        run: node ci/private-video.mjs
      - name: Validate shipped source
        run: |
          for file in dist/*.mjs server/*.mjs ci/*.mjs; do node --check "$file"; done
          node ci/privacy.mjs
      - name: Retain aggregate evaluation diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-vrc-evaluation-${{ github.sha }}
          path: |
            dist/evidence/headless-video.json
            artifacts/hf/publication.json
            artifacts/private-video-status.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: compact-vrc-site-${{ github.sha }}
          path: |
            dist/
            server/
          if-no-files-found: error
          retention-days: 7
