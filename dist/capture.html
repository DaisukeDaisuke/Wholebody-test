<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141c"><title>LANカメラ · 全身トラッキング</title><link rel="stylesheet" href="./style.css"></head><body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark">◌</span> 全身トラッキング</a><span class="muted small">撮影端末</span></header>
<main class="capture-main"><section class="intro"><div><p class="eyebrow">CAMERA → LOCAL PC</p><h1>この端末を、もう1つの視点に。</h1><p>映像をLAN内のPCへ直接送ります。推論はPCが担当します。</p></div></section>
<div id="capture-error" class="alert" hidden role="alert"></div><div class="panel capture-panel"><video id="preview" class="capture-video" muted playsinline autoplay></video>
<div class="form-grid"><label>カメラ<select id="capture-device"><option value="environment">背面カメラ</option><option value="user">前面カメラ</option></select></label><label>目標フレームレート<select id="capture-fps"><option value="30">30 fps</option><option value="60">60 fps</option></select></label><label>PC側の入力<select id="capture-slot"><option value="a">カメラ A</option><option value="b">カメラ B</option></select></label></div>
<div class="row"><button id="start-camera" class="primary">カメラを開く</button><button id="stop-camera">停止</button></div><p id="capture-status" class="muted">カメラはまだ開いていません。</p><div class="divider"></div>
<h2>接続サーバーを使う</h2><label>サーバーURL<input id="capture-url" type="url" placeholder="https://192.168.1.10:8443"></label><label>接続トークン<input id="capture-token" type="password" autocomplete="off"></label><label>ルーム名<input id="capture-room" value="wholebody" maxlength="48"></label><button id="join" class="primary">PCへ接続する</button>
<details><summary>サーバーなしで接続情報を交換する</summary><p>PCで作成した接続情報を貼り付けます。生成した応答をPCへ戻してください。</p><label>PCからの接続情報<textarea id="offer" rows="4" spellcheck="false"></textarea></label><button id="make-answer">応答を作る</button><label>PCへ戻す応答<textarea id="answer" rows="4" readonly spellcheck="false"></textarea></label><button id="copy-answer">応答をコピー</button></details>
<p class="small muted">画面を開いたまま使用します。OSの画面ロックやブラウザのバックグラウンド制限により、撮影が止まる場合があります。外部STUN・TURNによる中継は行いません。</p></div></main><script type="module" src="./capture.js"></script></body></html>
